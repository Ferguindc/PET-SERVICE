"""
Configuración para pytest (alternativa a unittest de Django)

Para usar pytest en lugar de unittest de Django:
1. Instalar: pip install pytest pytest-django
2. Crear este archivo: pytest.ini
3. Ejecutar: pytest
"""

[pytest]
DJANGO_SETTINGS_MODULE = pet_service.settings
python_files = tests.py test_*.py *_tests.py
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=pets
    --cov-report=term-missing
    --cov-report=html
